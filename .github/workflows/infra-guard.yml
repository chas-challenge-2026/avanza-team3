name: infra-guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
jobs:
  guard:
    name: infra-guard
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Installera PyYAML
        run: pip install pyyaml --quiet
      - name: Kontrollera plattformskontraktet
        run: python3 .github/scripts/infra_guard.py