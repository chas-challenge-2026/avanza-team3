name: CI

on:
  pull_request:
    branches: [main, develop]

  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Kör backend-tester
        working-directory: backend/AvanzaPortal
        run: mvn --batch-mode test


  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installera dependencies
        working-directory: frontend
        run: npm ci

      - name: Kör frontend-tester
        working-directory: frontend
        run: npm run test:run

      - name: Kör lint
        working-directory: frontend
        run: npm run lint

      - name: Bygg frontend
        working-directory: frontend
        run: npm run build