spring.datasource.url=jdbc:postgresql://db:5432/avanza
spring.datasource.username=avanza
spring.datasource.password=avanza123
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8082
spring.thymeleaf.cache=false
spring.jpa.hibernate.ddl-auto=validate
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.rate-limit.enabled=true
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-tokens=5
app.rate-limit.login.refill-period=1m
app.rate-limit.api.capacity=50
app.rate-limit.api.refill-tokens=2
app.rate-limit.api.refill-period=1s

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
